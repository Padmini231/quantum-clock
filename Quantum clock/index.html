```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Clock</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Courier New", monospace;
        background:
            radial-gradient(circle at center, #10233d 0%, #050914 45%, #010207 100%);
        color: #fff;
    }

    /* Background particles */
    .particles {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #00eaff;
        border-radius: 50%;
        box-shadow: 0 0 12px #00eaff;
        animation: float 8s infinite linear;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        100% {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }

    /* Main clock */
    .clock-container {
        position: relative;
        z-index: 2;
        width: min(90%, 700px);
        padding: 45px 35px;
        text-align: center;

        background: rgba(5, 15, 30, 0.72);
        border: 1px solid rgba(0, 234, 255, 0.45);
        border-radius: 30px;

        backdrop-filter: blur(15px);

        box-shadow:
            0 0 25px rgba(0, 234, 255, 0.25),
            inset 0 0 35px rgba(0, 234, 255, 0.05);
    }

    .title {
        color: #00eaff;
        font-size: 14px;
        letter-spacing: 6px;
        margin-bottom: 25px;
        text-shadow: 0 0 15px #00eaff;
    }

    .clock {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        font-size: clamp(45px, 10vw, 100px);
        font-weight: bold;
        color: #ffffff;

        text-shadow:
            0 0 10px #00eaff,
            0 0 25px #00eaff,
            0 0 50px rgba(0, 234, 255, 0.7);
    }

    .colon {
        animation: blink 1s infinite;
        color: #00eaff;
    }

    @keyframes blink {
        50% {
            opacity: 0.2;
        }
    }

    .milliseconds {
        font-size: clamp(18px, 4vw, 30px);
        color: #00eaff;
        margin-left: 8px;
    }

    .date {
        margin-top: 20px;
        font-size: 15px;
        color: #9eefff;
        letter-spacing: 3px;
    }

    /* Quantum ring */
    .quantum-ring {
        width: 170px;
        height: 170px;
        margin: 30px auto 20px;
        border-radius: 50%;
        position: relative;

        border: 1px solid rgba(0, 234, 255, 0.4);

        box-shadow:
            0 0 20px rgba(0, 234, 255, 0.25),
            inset 0 0 20px rgba(0, 234, 255, 0.15);

        animation: rotate 8s linear infinite;
    }

    .quantum-ring::before,
    .quantum-ring::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px dashed #00eaff;
    }

    .quantum-ring::after {
        inset: 40px;
        border-color: #a855f7;
        animation: rotateReverse 4s linear infinite;
    }

    .electron {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        box-shadow:
            0 0 10px #00eaff,
            0 0 25px #00eaff;

        top: -5px;
        left: 50%;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    @keyframes rotateReverse {
        from {
            transform: rotate(360deg);
        }

        to {
            transform: rotate(0deg);
        }
    }

    .state {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        padding: 10px 18px;

        border-radius: 30px;
        border: 1px solid rgba(0, 234, 255, 0.4);

        color: #00eaff;
        font-size: 12px;
        letter-spacing: 2px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff9d;
        box-shadow: 0 0 12px #00ff9d;
        animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
        50% {
            transform: scale(1.6);
            opacity: 0.4;
        }
    }

    .footer {
        margin-top: 20px;
        font-size: 10px;
        color: #607d8b;
        letter-spacing: 2px;
    }
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="clock-container">

    <div class="title">
        QUANTUM TIME SYSTEM
    </div>

    <div class="clock">
        <span id="hours">00</span>
        <span class="colon">:</span>
        <span id="minutes">00</span>
        <span class="colon">:</span>
        <span id="seconds">00</span>

        <span class="milliseconds" id="milliseconds">
            .000
        </span>
    </div>

    <div class="date" id="date">
        Loading...
    </div>

    <div class="quantum-ring">
        <div class="electron"></div>
    </div>

    <div class="state">
        <span class="status-dot"></span>
        QUANTUM STATE: STABLE
    </div>

    <div class="footer">
        PRECISION TIME • REAL-TIME SYNCHRONIZATION
    </div>

</div>

<script>

    /* =========================
       QUANTUM CLOCK
    ========================= */

    function updateClock() {

        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        let milliseconds = now.getMilliseconds();

        hours = String(hours).padStart(2, "0");
        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");
        milliseconds = String(milliseconds).padStart(3, "0");

        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
        document.getElementById("milliseconds").textContent =
            "." + milliseconds;

        const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        };

        document.getElementById("date").textContent =
            now.toLocaleDateString("en-IN", options);
    }

    setInterval(updateClock, 10);
    updateClock();


    /* =========================
       CREATE PARTICLES
    ========================= */

    const particleContainer =
        document.getElementById("particles");

    for (let i = 0; i < 70; i++) {

        const particle =
            document.createElement("div");

        particle.classList.add("particle");

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDelay =
            Math.random() * 8 + "s";

        particle.style.animationDuration =
            (5 + Math.random() * 8) + "s";

        particle.style.opacity =
            Math.random();

        particleContainer.appendChild(particle);
    }

</script>

</body>
</html>
